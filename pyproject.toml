[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy2ground"
dynamic = ["version"]
description = "1 m bare-earth terrain under rainforest canopy, from aerial imagery and a 30 m global DEM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Judge" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.3",
    "segmentation-models-pytorch==0.5.0",
    "timm>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "requests>=2.31",
    "Pillow>=10",
]
eval = ["sliderule>=4.0,<6"]
tiles = ["scipy>=1.11", "pmtiles>=3.4", "rio-rgbify>=0.4"]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff==0.15.*"]

[project.scripts]
c2g-train = "canopy2ground.train:main"
c2g-predict = "canopy2ground.predict:main"
c2g-prefetch = "canopy2ground.prefetch:main"
c2g-build = "canopy2ground.build.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "canopy2ground.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA", "data: needs the training cache (set C2G_CACHE)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741", "B905"]   # zip(strict=) is not wanted where band lists may be shorter than weights
